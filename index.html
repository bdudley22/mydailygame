<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Gamble!</title>
	<link rel="stylesheet" href="style.css">
	<style>
		section {flex-basis: 50%;}
	</style>
</head>

<body>
    <header>
        <img src="images/GAMBLE!.png" alt="gamble!" class="logo" width="1800" height="500">
    </header>
    <main>
        <h1 id="rouletteNumber">0</h1>
        <div ontouchstart="">
            <div class="button">
                <a href="#" id="gambleButton">GAMBLE</a>
            </div>
            <p id="daily">daily number is:</p>
        </div>
        <aside>
            <p>Checkout my other projects-</p>
        </aside>
        <div class="left-panel">

            <div class="bet-option">
                <h2 id="underState" class="state off">0</h2>
                <div class="button">
                    <a href="#" id="underButton">UNDER</a>
                </div>
            </div>

            <div class="bet-option">
                <h2 id="overState" class="state off">0</h2>
                <div class="button">
                    <a href="#" id="overButton">OVER</a>
                </div>
            </div>

        </div>
        <div class="wheel-container">

            <div class="button">
                <a href="#" id="spin">SPIN</a>
            </div>

            <canvas id="canvas" width="500" height="500"></canvas>

        </div>
    </main>
    <footer>
        <p>© 2026 Brooks Dudley | Go panthers.</p>
    </footer>
    <script src="game.js"></script>
</body>
</html>
