<!--Hello world-->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gamble!</title>
	<link rel="stylesheet" href="style.css">
	<style>
		section {flex-basis: 50%;}
	</style>
</head>

<body>
    <header>
        <img src="images/GAMBLE!.png" alt="gamble!">
    </header>
    <main>
        <h1 id="rouletteNumber">0</h1>
        <div ontouchstart="">
            <div class="button">
                <a href="#" id="gambleButton">GAMBLE</a>
            </div>
            <p id="daily">daily number is:</p>
        </div>
        <aside>
            <p>Checkout my other projects-</p>
        </aside>
        <div class="left-panel">

            <div class="bet-option">
                <h2 id="underState" class="state off">0</h2>
                <div class="button">
                    <a href="#" id="underButton">UNDER</a>
                    <p>WIN:1.5x LOSS:0.85x</p>
                </div>
            </div>

            <div class="bet-option">
                <h2 id="overState" class="state off">0</h2>
                <div class="button">
                    <a href="#" id="overButton">OVER</a>
                    <p>WIN:1.1x LOSS:0.8x</p>
                </div>
            </div>

        </div>
        <div class="left-panel-two">
            <div>
                <img src="images/coin.png">
            </div>
            <div>
                <p id="gold">GOLD: </p>
            </div>
        </div>
        <div class="left-panel-three">
            <div>
                <img src="images/ODDS.png">
            </div>
        </div>
        <div class="wheel-container">

            <div class="button">
                <a href="#" id="spin">SPIN</a>
            </div>

            <canvas id="canvas" width="500" height="500"></canvas>

        </div>
        <div class="slot-machine">

            <h1 id="slotResult">🎰 SLOT MACHINE 🎰</h1>

            <div class="slots">
                <div class="slot" id="slot1">🍒</div>
                <div class="slot" id="slot2">🍋</div>
                <div class="slot" id="slot3">🍇</div>
            </div>

            <div class="button">
                <a href="#" id="slotButton">SPIN SLOTS</a>
            </div>

        </div>
    </main>
    <footer>
        <p>© 2026 | Go panthers.</p>
    </footer>
    <script src="game.js"></script>
    <script src="slots.js"></script>
</body>
</html>
